<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TASKS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0e0e0e;
      --surface:  #181818;
      --border:   #2a2a2a;
      --accent:   #c8ff00;
      --text:     #e8e8e8;
      --muted:    #666;
      --danger:   #ff4444;
      --radius:   4px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 40px;
    }

    /* ── Header ── */
    header {
      width: 100%;
      max-width: 560px;
      margin-bottom: 48px;
    }
    header h1 {
      font-family: 'Space Mono', monospace;
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1;
    }
    header h1 span {
      color: var(--accent);
    }
    header p {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.85rem;
      font-family: 'Space Mono', monospace;
    }

    /* ── Input Row ── */
    .input-row {
      width: 100%;
      max-width: 560px;
      display: flex;
      gap: 10px;
      margin-bottom: 32px;
    }
    .input-row input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.15s;
    }
    .input-row input::placeholder { color: var(--muted); }
    .input-row input:focus { border-color: var(--accent); }
    .input-row button {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #0e0e0e;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 12px 20px;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .input-row button:hover  { opacity: 0.88; }
    .input-row button:active { transform: scale(0.97); }

    /* ── Stats Bar ── */
    .stats {
      width: 100%;
      max-width: 560px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .stats #task-count { color: var(--accent); font-weight: 700; }

    /* ── Task List ── */
    #task-list {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      padding: 14px 16px;
      gap: 12px;
      animation: slideIn 0.2s ease;
      transition: border-color 0.15s;
    }
    .task-item:hover { border-color: #3a3a3a; }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task-title {
      flex: 1;
      font-size: 0.95rem;
      font-weight: 400;
      line-height: 1.4;
      word-break: break-word;
    }
    .task-date {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .delete-btn {
      background: none;
      border: 1px solid transparent;
      border-radius: var(--radius);
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 4px 8px;
      transition: color 0.15s, border-color 0.15s;
    }
    .delete-btn:hover {
      color: var(--danger);
      border-color: var(--danger);
    }

    /* ── Empty State ── */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty .icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
      display: block;
      opacity: 0.4;
    }
    .empty p {
      font-family: 'Space Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
    }

    /* ── Error Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--danger);
      color: #fff;
      font-family: 'Space Mono', monospace;
      font-size: 0.78rem;
      padding: 10px 20px;
      border-radius: var(--radius);
      transition: transform 0.25s ease;
      pointer-events: none;
      z-index: 100;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ── Loading ── */
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header>
    <h1>TASK<span>S</span></h1>
    <p>// simple. focused. done.</p>
  </header>

  <div class="input-row">
    <input
      type="text"
      id="task-input"
      placeholder="what needs doing?"
      maxlength="200"
      autocomplete="off"
    />
    <button id="add-btn" onclick="addTask()">+ ADD</button>
  </div>

  <div class="stats">
    <span>OPEN TASKS: <span id="task-count">0</span></span>
    <span id="conn-status">●&nbsp;CONNECTING</span>
  </div>

  <div id="task-list">
    <div class="spinner"></div>
  </div>

  <div id="toast"></div>

<script>
  // ── Config ──────────────────────────────────────────────────
  const API = (window.APP_CONFIG?.API_BASE_URL || 'http://localhost:8080').replace(/\/$/, '');

  // ── Helpers ─────────────────────────────────────────────────
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function setStatus(ok) {
    const el = document.getElementById('conn-status');
    el.textContent = ok ? '● CONNECTED' : '● OFFLINE';
    el.style.color = ok ? 'var(--accent)' : 'var(--danger)';
  }

  // ── Render ───────────────────────────────────────────────────
  function render(tasks) {
    const list = document.getElementById('task-list');
    document.getElementById('task-count').textContent = tasks.length;

    if (tasks.length === 0) {
      list.innerHTML = `
        <div class="empty">
          <span class="icon">◻</span>
          <p>NO TASKS YET</p>
        </div>`;
      return;
    }

    list.innerHTML = tasks.map(t => `
      <div class="task-item" id="task-${t.id}">
        <span class="task-title">${escapeHtml(t.title)}</span>
        <span class="task-date">${t.created_at}</span>
        <button class="delete-btn" onclick="deleteTask(${t.id})" title="Delete">✕</button>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── API Calls ────────────────────────────────────────────────
  async function loadTasks() {
    try {
      const res = await fetch(`${API}/api/tasks`);
      if (!res.ok) throw new Error();
      const tasks = await res.json();
      setStatus(true);
      render(tasks);
    } catch {
      setStatus(false);
      document.getElementById('task-list').innerHTML = `
        <div class="empty">
          <span class="icon">⚠</span>
          <p>CANNOT REACH BACKEND</p>
        </div>`;
    }
  }

  async function addTask() {
    const input = document.getElementById('task-input');
    const title = input.value.trim();
    if (!title) { input.focus(); return; }

    const btn = document.getElementById('add-btn');
    btn.disabled = true;
    btn.textContent = '...';

    try {
      const res = await fetch(`${API}/api/tasks`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title }),
      });
      if (!res.ok) throw new Error();
      input.value = '';
      await loadTasks();
    } catch {
      showToast('Failed to add task');
    } finally {
      btn.disabled = false;
      btn.textContent = '+ ADD';
      input.focus();
    }
  }

  async function deleteTask(id) {
    const el = document.getElementById(`task-${id}`);
    if (el) el.style.opacity = '0.4';

    try {
      const res = await fetch(`${API}/api/tasks/${id}`, { method: 'DELETE' });
      if (!res.ok) throw new Error();
      await loadTasks();
    } catch {
      showToast('Failed to delete task');
      if (el) el.style.opacity = '1';
    }
  }

  // ── Keyboard shortcut ────────────────────────────────────────
  document.getElementById('task-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  // ── Boot ─────────────────────────────────────────────────────
  loadTasks();
</script>
</body>
</html>
