name:  "RDS Creation"
on:
  workflow_dispatch:
  workflow_call:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'infrastructure/rds/**'
jobs:
  rds-infra-creation:
        runs-on: self-hosted
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{ secrets.AWS_ROLE_ARN }} # use oidc instead of access and secret key
                aws-region: us-east-2
            
            - name: Cache Terraform
              uses: actions/cache@v4
              with:r/.terra
                path: infrastructure/rds/.terraform
                key: terraform-${{ hashFiles('infrastructure/rds/.terraform.lock.hcl') }} #cache module

            - uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: 1.15.4
            
            - name: Terraform init
              working-directory: infrastructure/rds
              run: terraform init
            
            - name: Terraform apply
              working-directory: infrastructure/rds
              env:
                TF_VAR_db_username: ${{secrets.DB_USERNAME}}
                TF_VAR_db_password: ${{secrets.DB_PASSWORD}}
              run: terraform apply -auto-approve
            
            - name: Download artiface i.e tfstate file
              uses: actions/upload-artifact@v4
              with:
                name: terraform-state
                path: infrastructure/rds/terraform.tfstate

  