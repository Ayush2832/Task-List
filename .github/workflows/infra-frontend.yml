name: Terraform test

on:
  workflow_dispatch:

permissions:
    id-token: write
    contents: read
jobs:
    test-cred-job:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{ env.AWS_ROLE_ARN }}
                aws-region: us-east-2
            
            - name: check aws cred
              run: |
                aws sts get-caller-identity