name: Frontend Infra Creation

on:
  # push:
  #   branches:
  #       - main
  #   paths:
  #       - 'infrastructure/frontend/**'
  workflow_dispatch:

permissions:
    id-token: write
    contents: read
jobs:
    frontend-infra-creation:
        runs-on: self-hosted
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{ secrets.AWS_ROLE_ARN }} # use oidc instead of access and secret key
                aws-region: us-east-2
            
            - name: Cache Terraform
              uses: actions/cache@v4
              with:
                path: infrastructure/frontend/.terraform
                key: terraform-${{ hashFiles('infrastructure/frontend/.terraform.lock.hcl') }} #cache module

            - uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: 1.15.4
            
            - name: Terraform init
              working-directory: infrastructure/frontend
              run: terraform init
            
            - name: Terraform apply
              working-directory: infrastructure/frontend
              env:
                TF_VAR_certificate_arn: ${{ vars.CERTIFICATE_ARN }}
              run: terraform apply -auto-approve
            
            - name: Download artiface i.e tfstate file
              uses: actions/upload-artifact@v4
              with:
                name: terraform-state
                path: infrastructure/frontend/terraform.tfstate

    rds-infra-creation:
        needs: frontend-infra-creation
        uses: ./.github/workflows/infra-rds.yml
        secrets: inherit
